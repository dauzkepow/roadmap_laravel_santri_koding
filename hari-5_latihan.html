<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Tailwind Hari-5</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="my-16 w-2/3 mx-auto border border-slate-300 rounded">
      <div class="m-4 p-4 bg-red-300">
        Box 1: Margin 1rem di semua sisi, padding 1rem di dalam
      </div>

      <div class="mt-8 px-6 py-2 bg-yellow-300">
        Box 2: Margin atas 2 rem, padding kiri-kanan 1.5rem, padding atas-bawah

      </div>

      <div class="mx-10 p-8 bg-blue-400">
        Box 3: Margin kiri-kanan 2.5rem, padding semua sisi 2rem.
      </div>
    </div>
  </body>
