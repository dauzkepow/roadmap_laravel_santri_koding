<!-- 
  - mengenal cara instalasi tailwind
  - buat project pertama
  - menjalankan file html dengan class tailwind

-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Belajar Tailwind</title>
    <!-- Setup tailwind dengan CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <!--
    - bg-gray-100 → warna background abu muda
    - flex justify-center items-center h-screen → membuat konten ada di tengah layar
    - text-3xl font-bold text-blue-600 → teks biru besar tebal.
  -->

  <body class="bg-gray-100 flex justify-center items-center h-screen">
    <h1 class="text-3xl font-bold text-blue-600">Halo, Tailwind!</h1>
  </body>
</html>
