<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Tailwind Hari-7</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-10 bg-gray-100">
    <!-- Container Card -->
    <div class="max-w-sm mx-auto bg-white rounded-lg shadow-md p-6 text-center">
      <!-- Gambar -->
      <img
        src="https://i.pravatar.cc/150?img-4"
        alt="avatar"
        class="w-24 h-24 rounded-full mx-auto border-4 border-blue-500 mb-4"
      />
      <!-- Teks -->
      <h2 class="text-2xl font-bold text-gray-800">Jhon Doeng</h2>
      <p class="text-gray-600 mb-4">Frontend Developer</p>
      <!-- Button -->
      <button
        class="bg-blue-500 text-white px-4 py-2 rounded shadow hover:bg-blue-600"
      >
        Follow
      </button>
    </div>
    <br />
    <!-- Card-1 -->
    <div class="max-w-xs mx-auto bg-white rounded shadow-md p-4 text-center">
      <img
        src="https://i.pravatar.cc/150?img-1"
        alt="avatar-1"
        class="w-24 h-24 rounded-full mx-auto border-2 border-blue-500 mb-4"
      />
      <h2 class="text-2xl font-bold text-gray-900 mb-4">Kepow</h2>
      <p class="text-gray-600 mb-4 text-center">
        Web developer yang suka ngulik desain modern dengan Tailwind CSS.
      </p>
    </div>
    <br />
    <!-- Card-2 -->
    <div class="bg-blue-50 rounded shadow-lg p-6 w-64 text-center">
      <img
        src="https://i.pravatar.cc/150?img-5"
        alt="avatar-2"
        class="w-24 h-24 rounded-full mx-auto border-2 border-green-500 mb-4"
      />
      <h2 class="text-2xl font-bold text-gray-900 mb-4">Jone Smith</h2>
      <p class="text-sm text-gray-600 mb-4 text-justify">
        Seorang UI/UX enthusiast yang senang membuat tampilan simple tapi elegan
      </p>
      <button
        class="bg-green-500 text-white py-2 px-4 rounded mb-4 shadow hover:bg-green-600"
      >
        Message
      </button>
    </div>
  </body>
</html>

<!-- Tips 
  - gunakan kombinasi spacing yang konsisten (p-4 dalam card, mb-4 antar elemen)
  - mulai dengan default aman text-base, p-4, rounded-lg, shadow-md
  - berikan hover agar interaktif
-->
