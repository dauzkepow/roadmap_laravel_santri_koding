<!-- 
    - membuat border dengan utility class tailwind
    - mengenal style border (solid, dashed, dotted)
    - membuat sudut kotak lebih halus dengan rounded
-->

<!--
    1. Border Dasar
        • border → membuat border default 1px solid.
        • border-2, border-4 → ketebalan border.
        • border-red-500 → warna border.

    2. Border Style
        • border-solid (default).
        • border-dashed.
        • border-dotted.
        • border-double

    3. Border Radius (rounded)
        • rounded-sm → sedikit melengkung.
        • rounded-lg → lebih melengkung.
        • rounded-full → membuat lingkaran (jika kotak = persegi).

    4. Shadow (bayangan)
        • shadow-sm → bayangan tipis.
        • shadow → bayangan default.
        • shadow-lg → bayangan besar.
        • shadow-inner → bayangan ke dalam.
        • shadow-none → tanpa bayangan.

    Tips = bikin avatar foto profil atau button bulat cukup kombinasi rounded-full
           dengan ukuran lebar tinggi sama w-20 h-20
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hari-6</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-10 flex gap-6 flex-wrap">
    <!-- Border Solid -->
    <div class="w-32 h-20 border-2 border-blue-500 shadow">Solid</div>

    <!-- Border dashed + Rounded -->
    <div
      class="w-32 h-20 border-4 border-red-500 border-dashed rounded-lg shadow-lg"
    >
      Dashed Rounded
    </div>

    <!-- Border dotted + full circle -->
    <div
      class="w-20 h-20 border-4 border-green-500 border-dotted rounded-full shadow-inner"
    ></div>

    <!-- Border double tanpa shadow -->
    <div class="w-32 h-20 border-4 border-purple-500 border-double shadow-none">
      Double
    </div>
  </body>
</html>
