<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Tailwind Hari-3</title>
    <!-- setup tailwind dengan CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="my-16 flex flex-col gap-8 justify-center items-center w-full">
      <div class="flex gap-2">
        <div class="p-6 bg-green-800 rounded">
          <p class="text-green-100 font-semibold">Grenn</p>
        </div>
        <div class="p-6 bg-blue-800 rounded">
          <p class="text-blue-100 font-semibold">Blue</p>
        </div>
        <div class="p-6 bg-yellow-500 rounded">
          <p class="text-yellow-900 font-semibold">Yellow</p>
        </div>
      </div>
      <!-- Gradient -->
      <div class="p-6 bg-gradient-to-b from-pink-600 to-orange-500 text-white">
        <p>Gradient Pink to Orange</p>
      </div>

      <!-- Alert Sukses -->
      <div class="border border-green-400 bg-green-100 rounded p-4">
        <p class="text-green-700">Success: Data Saved!</p>
      </div>
    </div>
  </body>
</html>
